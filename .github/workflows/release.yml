name: Release Build & Distribution Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel (stable or preview)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - preview

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install NSIS Compiler
      shell: pwsh
      run: |
        choco install nsis --yes --no-progress
        $compiler = "C:\Program Files (x86)\NSIS\makensis.exe"
        if (-not (Test-Path -LiteralPath $compiler)) { throw "NSIS compiler not found after installation." }
        Write-Host "NSIS compiler installed: $compiler"

    - name: Build Distribution Bundle
      shell: pwsh
      run: |
        $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v3.0.0" }
        .\scripts\build-distribution.ps1 -Configuration Release -Version $tag

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/release/LocalModelConductor-Setup-win-x64.exe
          dist/release/LocalModelConductor-Portable-win-x64.zip
          dist/release/SHA256SUMS.txt
          dist/release/release-manifest.json
          install.ps1
          THIRD-PARTY-NOTICES.md
        draft: true
        prerelease: ${{ github.event.inputs.release_channel == 'preview' }}
