name: CI Build & Automated Tests

on:
  push:
    branches: [ "main", "dev", "phase4b-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore LocalModelConductor.sln

    - name: Build Solution (Release)
      run: dotnet build LocalModelConductor.sln -c Release --no-restore

    - name: Execute Full Regression Suite
      id: test_step
      continue-on-error: true
      run: |
        dotnet test tests/LocalLlmConsole.Tests/LocalLlmConsole.Tests.csproj -c Release --no-build --logger "trx;LogFileName=regression-results.trx"

    - name: Upload Test Report (TRX)
      uses: actions/upload-artifact@v4
      with:
        name: test-results-trx
        path: tests/LocalLlmConsole.Tests/TestResults/*.trx
        if-no-files-found: warn
